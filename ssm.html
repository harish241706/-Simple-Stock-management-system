<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>harish</title>
    <title>23MIs0368</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Link External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="font-sans leading-normal tracking-normal">

    <!-- Navbar -->
    <nav class="bg-indigo-600 p-4 text-white shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold"><i class="fa-solid fa-boxes-stacked mr-2"></i>StockFlow</h1>
            <span class="text-sm bg-indigo-700 py-1 px-3 rounded-full">Simple Inventory System</span>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container mx-auto p-6 max-w-6xl">
        
        <!-- Statistics Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
            <div class="bg-white p-5 rounded-lg shadow border-l-4 border-indigo-500">
                <p class="text-gray-500 text-sm font-semibold">Total Products</p>
                <h3 id="totalProducts" class="text-2xl font-bold text-gray-800">0</h3>
            </div>
            <div class="bg-white p-5 rounded-lg shadow border-l-4 border-green-500">
                <p class="text-gray-500 text-sm font-semibold">Total Stock Value</p>
                <h3 id="totalValue" class="text-2xl font-bold text-gray-800">$0.00</h3>
            </div>
            <div class="bg-white p-5 rounded-lg shadow border-l-4 border-red-500">
                <p class="text-gray-500 text-sm font-semibold">Low Stock Items (&lt; 5)</p>
                <h3 id="lowStockCount" class="text-2xl font-bold text-gray-800">0</h3>
            </div>
        </div>

        <!-- Action Bar: Add Form & Search -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Add/Edit Product Form -->
            <div class="bg-white p-6 rounded-lg shadow lg:col-span-1">
                <h2 id="formTitle" class="text-xl font-bold mb-4 text-gray-800 border-b pb-2">Add New Product</h2>
                <form id="stockForm">
                    <input type="hidden" id="productId">
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="productName">Product Name</label>
                        <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-indigo-500" id="productName" type="text" placeholder="e.g., Wireless Mouse" required>
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="productCategory">Category</label>
                        <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-indigo-500" id="productCategory" type="text" placeholder="e.g., Electronics" required>
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="productQuantity">Quantity</label>
                        <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-indigo-500" id="productQuantity" type="number" min="0" placeholder="e.g., 15" required>
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2" for="productPrice">Price ($)</label>
                        <input class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:ring-2 focus:ring-indigo-500" id="productPrice" type="number" step="0.01" min="0" placeholder="e.g., 29.99" required>
                    </div>
                    <div class="flex items-center justify-between">
                        <button class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline w-full transition" type="submit" id="submitBtn">
                            Add Product
                        </button>
                        <button type="button" id="cancelBtn" class="hidden bg-gray-400 hover:bg-gray-500 text-white font-bold py-2 px-4 rounded ml-2 transition">
                            Cancel
                        </button>
                    </div>
                </form>
            </div>

            <!-- Inventory Display Table -->
            <div class="bg-white p-6 rounded-lg shadow lg:col-span-2 flex flex-col">
                <div class="flex justify-between items-center mb-4 border-b pb-2">
                    <h2 class="text-xl font-bold text-gray-800">Inventory List</h2>
                    <div class="relative">
                        <input type="text" id="searchInput" placeholder="Search products..." class="shadow border rounded py-1 px-3 pl-8 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <i class="fa-solid fa-search absolute left-2.5 top-2.5 text-gray-400 text-xs"></i>
                    </div>
                </div>

                <div class="overflow-x-auto flex-grow">
                    <table class="min-w-full leading-normal">
                        <thead>
                            <tr>
                                <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-50 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Name</th>
                                <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-50 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Category</th>
                                <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-50 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Qty</th>
                                <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-50 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Price</th>
                                <th class="px-5 py-3 border-b-2 border-gray-200 bg-gray-50 text-center text-xs font-semibold text-gray-600 uppercase tracking-wider">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="stockTableBody">
                            <!-- Dynamic Content Injected Here -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <!-- Link External JS -->
    <script src="script.js"></script>
</body>
</html>
